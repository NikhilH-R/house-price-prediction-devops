<!DOCTYPE html>
<html lang="en">

  <head>

    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Application Title -->
    <title>House Price Prediction | ML Dashboard</title>

    <!-- Application Metadata -->
    <meta
      name="description"
      content="A full-stack machine learning application
      for estimating California housing values using
      Random Forest regression, FastAPI and TypeScript."
    />

    <meta
      name="author"
      content="Nikhil H R"
    />

    <meta
      name="keywords"
      content="Machine Learning, House Price Prediction,
      Random Forest, Python, FastAPI, TypeScript,
      Vite, Full Stack Development, REST API"
    />

    <meta
      name="theme-color"
      content="#0f172a"
    />

    <!-- Application Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Open Graph Metadata -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="House Price Prediction | ML Dashboard"
    />

    <meta
      property="og:description"
      content="A full-stack machine learning dashboard
      powered by Random Forest, FastAPI and TypeScript."
    />

  </head>

  <body>

    <!-- JavaScript Disabled Fallback -->
    <noscript>
      <p>
        JavaScript is required to run the House Price
        Prediction application. Please enable JavaScript
        in your browser and reload this page.
      </p>
    </noscript>

    <!-- Application Root -->
    <div id="app"></div>

    <!-- TypeScript Application Entry Point -->
    <script
      type="module"
      src="/src/main.ts"
    ></script>

  </body>

</html>

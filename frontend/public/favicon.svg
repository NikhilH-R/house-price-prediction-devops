<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="64"
     height="64"
     role="img"
     aria-labelledby="title">

  <title id="title">House Price Prediction</title>

  <!-- Background -->
  <rect
    width="64"
    height="64"
    rx="14"
    fill="#0f172a"
  />

  <!-- House Roof -->
  <path
    d="M12 30 L32 12 L52 30"
    fill="none"
    stroke="#ffffff"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- House Structure -->
  <path
    d="M18 27 V51 H46 V27"
    fill="none"
    stroke="#ffffff"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Predictive Analytics Graph -->
  <path
    d="M24 42 L30 36 L35 40 L42 31"
    fill="none"
    stroke="#60a5fa"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Growth Arrow -->
  <path
    d="M36 31 H42 V37"
    fill="none"
    stroke="#60a5fa"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

</svg>
